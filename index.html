<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtistVault • Aesthetic Performer & Video Showcase</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#07090e',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Aesthetic Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-violet-600 selection:text-white relative">

  <!-- Ambient Glowing Mesh Background -->
  <div class="ambient-bg">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-40 glass-nav border-b border-white/8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3.5 cursor-pointer select-none shrink-0" onclick="navigateTo('performers')">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-violet-600 via-fuchsia-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-violet-600/40 ring-1 ring-white/20">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent font-heading">
            ARTIST<span class="text-violet-400">VAULT</span>
          </span>
          <span class="block text-[10px] uppercase font-bold tracking-widest text-violet-300/80">
            Performer Repertoire
          </span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1.5 p-1.5 rounded-2xl bg-slate-900/80 border border-white/8 text-xs font-bold">
        <button id="navPerformers" onclick="navigateTo('performers')"
                class="px-4 py-2 rounded-xl text-white bg-violet-600/30 border border-violet-500/40 shadow-md shadow-violet-600/20 transition-all flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>Performers</span>
        </button>
        <button id="navVideos" onclick="navigateTo('all-videos')"
                class="px-4 py-2 rounded-xl text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2">
          <i data-lucide="film" class="w-4 h-4"></i>
          <span>All Videos</span>
        </button>
      </nav>

      <!-- Global Search Bar -->
      <div class="flex-1 max-w-md relative hidden sm:block">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input type="text" id="globalSearchInput"
               placeholder="Search artists, stage names, video titles..."
               class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-white/10 focus:border-violet-500 focus:ring-1 focus:ring-violet-500 rounded-2xl text-xs text-slate-200 placeholder-slate-500 outline-none transition-all shadow-inner backdrop-blur-xl">
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-2.5 shrink-0">
        <button onclick="openVideoModal()" title="Add Video"
                class="px-3.5 py-2.5 rounded-2xl bg-slate-900/90 hover:bg-slate-800 border border-white/10 text-slate-300 hover:text-white text-xs font-bold transition-all flex items-center gap-1.5 backdrop-blur-xl shadow-lg">
          <i data-lucide="video" class="w-4 h-4 text-violet-400"></i>
          <span class="hidden sm:inline">Add Video</span>
        </button>

        <button onclick="openPerformerModal()" title="Add Performer"
                class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white text-xs font-bold shadow-xl shadow-violet-600/30 transition-all flex items-center gap-1.5">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Add Artist</span>
        </button>

        <!-- Backup & Settings Menu -->
        <div class="relative group">
          <button class="p-2.5 rounded-2xl bg-slate-900/90 hover:bg-slate-800 border border-white/10 text-slate-400 hover:text-white transition-all backdrop-blur-xl" title="Data Backup & Options">
            <i data-lucide="more-vertical" class="w-4 h-4"></i>
          </button>
          
          <div class="absolute right-0 mt-2 w-52 rounded-2xl bg-slate-900/95 border border-white/10 shadow-2xl p-2 hidden group-hover:block hover:block z-50 backdrop-blur-2xl">
            <button onclick="exportCatalogJSON()" class="w-full text-left px-3.5 py-2.5 rounded-xl hover:bg-slate-800 text-xs font-semibold text-slate-200 flex items-center gap-2.5">
              <i data-lucide="download" class="w-4 h-4 text-violet-400"></i> Export JSON Backup
            </button>
            <button onclick="triggerImportJSON()" class="w-full text-left px-3.5 py-2.5 rounded-xl hover:bg-slate-800 text-xs font-semibold text-slate-200 flex items-center gap-2.5">
              <i data-lucide="upload" class="w-4 h-4 text-indigo-400"></i> Import JSON Backup
            </button>
            <div class="my-1.5 border-t border-white/5"></div>
            <button onclick="if(confirm('Reset all catalog data to sample default performers and videos?')) state.resetToDefault(); render();"
                    class="w-full text-left px-3.5 py-2.5 rounded-xl hover:bg-rose-950/40 text-xs font-semibold text-rose-400 flex items-center gap-2.5">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset to Sample Data
            </button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Mobile Search Bar -->
  <div class="sm:hidden px-4 pt-4 pb-1 relative z-10">
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
        <i data-lucide="search" class="w-4 h-4"></i>
      </div>
      <input type="text"
             oninput="state.searchQuery = this.value; render();"
             placeholder="Search artists, videos..."
             class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-white/10 rounded-2xl text-xs text-slate-200 placeholder-slate-500 outline-none backdrop-blur-xl">
    </div>
  </div>

  <!-- Dynamic Main Content Area -->
  <main id="mainContent" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Aesthetic Footer -->
  <footer class="mt-auto border-t border-white/5 py-8 text-xs text-slate-500 relative z-10 bg-slate-950/70 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
        <p class="font-medium text-slate-400">ArtistVault &copy; 2026 • Curated Repertoire & Video Archives</p>
      </div>
      <div class="flex items-center gap-4 text-slate-400">
        <span>Offline-Ready (LocalStorage)</span>
        <span>•</span>
        <button onclick="exportCatalogJSON()" class="hover:text-white transition-colors">Download Database</button>
      </div>
    </div>
  </footer>

  <!-- MODAL 1: ADD / EDIT PERFORMER -->
  <div id="performerModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md modal-overlay">
    <div class="glass-panel w-full max-w-xl rounded-3xl border border-white/10 shadow-2xl overflow-hidden modal-content max-h-[92vh] flex flex-col">
      <!-- Modal Header -->
      <div class="px-7 py-5 border-b border-white/8 flex items-center justify-between">
        <h3 id="performerModalTitle" class="text-lg font-bold text-white flex items-center gap-2 font-heading">
          <i data-lucide="user" class="w-5 h-5 text-violet-400"></i> Add New Performer
        </h3>
        <button onclick="closePerformerModal()" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Body (Form) -->
      <form id="performerForm" onsubmit="handlePerformerFormSubmit(event)" class="p-7 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="performerIdInput">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Artist Real / Full Name *</label>
            <input type="text" id="perfName" required placeholder="e.g. Elena Rostova"
                   class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Stage Name / Alias</label>
            <input type="text" id="perfStageName" placeholder="e.g. ASTRAEA"
                   class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Headline Role</label>
            <input type="text" id="perfRole" placeholder="e.g. Electric Violinist & Composer"
                   class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Genre / Style</label>
            <input type="text" id="perfGenre" placeholder="e.g. Instrumental / Electronic"
                   class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Artist Biography</label>
          <textarea id="perfBio" rows="3" placeholder="Background story, creative credentials, festival tours..."
                    class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none resize-none"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Profile Photo URL</label>
            <input type="url" id="perfAvatarUrl" placeholder="https://images.unsplash.com/..."
                   class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Cover Banner URL</label>
            <input type="url" id="perfCoverUrl" placeholder="https://images.unsplash.com/..."
                   class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none">
          </div>
        </div>

        <!-- Social Media Channels -->
        <div class="pt-2">
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-400 mb-2">Social & External Links</label>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input type="url" id="perfWebsite" placeholder="Website URL"
                   class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
            <input type="url" id="perfYoutube" placeholder="YouTube Channel"
                   class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
            <input type="url" id="perfInstagram" placeholder="Instagram Profile"
                   class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="pt-4 border-t border-white/8 flex items-center justify-end gap-3">
          <button type="button" onclick="closePerformerModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors">
            Cancel
          </button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-xs font-bold text-white shadow-xl shadow-violet-600/30 transition-all">
            Save Artist Profile
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: ADD / EDIT VIDEO -->
  <div id="videoModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md modal-overlay">
    <div class="glass-panel w-full max-w-lg rounded-3xl border border-white/10 shadow-2xl overflow-hidden modal-content max-h-[92vh] flex flex-col">
      <!-- Modal Header -->
      <div class="px-7 py-5 border-b border-white/8 flex items-center justify-between">
        <h3 id="videoModalTitle" class="text-lg font-bold text-white flex items-center gap-2 font-heading">
          <i data-lucide="video" class="w-5 h-5 text-violet-400"></i> Add Video Title
        </h3>
        <button onclick="closeVideoModal()" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Body (Form) -->
      <form id="videoForm" onsubmit="handleVideoFormSubmit(event)" class="p-7 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="videoIdInput">

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Assign to Artist *</label>
          <select id="vidPerformerSelect" required
                  class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Video Title / Name *</label>
          <input type="text" id="vidTitle" required placeholder="e.g. Neon Requiem (Live at Grand Arena)"
                 class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Category</label>
            <input type="text" id="vidCategory" placeholder="e.g. Live Concert"
                   class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Duration</label>
            <input type="text" id="vidDuration" placeholder="e.g. 4:45"
                   class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Year</label>
            <input type="text" id="vidYear" placeholder="e.g. 2026"
                   class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Video Link / YouTube URL (Optional)</label>
          <input type="url" id="vidUrl" placeholder="https://www.youtube.com/watch?v=..."
                 class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Custom Thumbnail URL (Optional)</label>
          <input type="url" id="vidThumbnail" placeholder="https://images.unsplash.com/..."
                 class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Description / Liner Notes</label>
          <textarea id="vidDesc" rows="3" placeholder="Context, venue, musical personnel..."
                    class="w-full px-4 py-2.5 rounded-2xl bg-slate-900 border border-white/10 text-xs text-white focus:border-violet-500 outline-none resize-none"></textarea>
        </div>

        <!-- Modal Footer -->
        <div class="pt-4 border-t border-white/8 flex items-center justify-end gap-3">
          <button type="button" onclick="closeVideoModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors">
            Cancel
          </button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-xs font-bold text-white shadow-xl shadow-violet-600/30 transition-all">
            Save Video
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 3: CINEMA VIDEO PLAYER MODAL -->
  <div id="cinemaModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/90 backdrop-blur-xl modal-overlay">
    <div class="glass-panel w-full max-w-4xl rounded-3xl border border-white/15 shadow-2xl overflow-hidden modal-content max-h-[92vh] flex flex-col p-6 relative">
      <button onclick="closeCinemaModal()" class="absolute top-4 right-4 z-20 p-2 rounded-full bg-slate-950/80 hover:bg-slate-900 text-slate-300 hover:text-white transition-colors border border-white/10">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div id="cinemaModalBody" class="overflow-y-auto flex-1">
        <!-- Rendered by openCinemaModal -->
      </div>
    </div>
  </div>

  <!-- Hidden File Input for JSON Backup Import -->
  <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="handleJSONFileSelected(event)">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
